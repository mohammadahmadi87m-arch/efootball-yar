<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>فوتبال یار</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            text-align: center;
            padding: 50px 20px;
        }

        .box {
            max-width: 600px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,.1);
        }

        h1 {
            color: #16803c;
        }

        p {
            font-size: 18px;
        }
    </style>
</head>

<body>
    <div class="box">
        <h1>⚽ فوتبال یار</h1>
        <p>به سایت فوتبال یار خوش آمدید!</p>
        <p>سایت با موفقیت اجرا شد 🎉</p>
    </div>
</body>
</html>
